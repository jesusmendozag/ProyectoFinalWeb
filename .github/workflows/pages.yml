# Publica la versión estática del sitio en GitHub Pages cada vez que se sube algo a main.
# Requisito (una sola vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KukinWeb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: KukinWeb/package-lock.json

      - name: Instalar dependencias
        run: npm ci --omit=dev

      - name: Generar sitio estático
        run: npm run build:static
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Enlace público al APK de prueba (el mismo que en el .env local)
          APK_DOWNLOAD_URL: https://github.com/jesusmendozag/kukin-releases/releases/latest

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: KukinWeb/dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
